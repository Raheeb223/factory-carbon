# Render Blueprint: one-click deploy of the backend (Docker, free plan, Singapore).
# Render dashboard -> New -> Blueprint -> pick this GitHub repo -> paste GEMINI_API_KEY.
# Free plan: spins down after 15 min idle, ~1 min to wake. See README "Deployment".
services:
  - type: web
    name: factory-carbon-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile   # paths are relative to the repo root
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**                        # app-only changes do not redeploy the API
    healthCheckPath: /livez
    envVars:
      - key: APP_TOKEN
        sync: false           # same value as APP_TOKEN in app/env/prod.json
      - key: GEMINI_API_KEY
        sync: false           # you are asked for it when creating the Blueprint
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DAILY_GEMINI_CAP
        value: "200"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: TRUST_PROXY_HEADERS
        value: "true"
