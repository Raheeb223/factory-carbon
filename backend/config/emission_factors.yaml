# Emission factors used by the carbon calculator (spec 6.2).
#
# Every entry has: value, unit, source, year, status (verified | PLACEHOLDER).
# "verified" here means: the value was checked against the primary published
# document named in `source` (see `notes` for the date and exact reference).
# Re-check when a newer edition is published, and confirm the buyer accepts it.

grid_electricity:
  value: 0.62
  unit: kg_CO2_per_kWh
  source: >-
    Department of Environment, Government of Bangladesh (Article 6 Designated National
    Authority), letter "Grid Emission Factor (GEF) for Bangladesh", Ref.
    22.02.0000.063.61.009.23-37, 23 January 2025: 0.62 tCO2/MWh for FY 2020-21 and
    FY 2021-22 (0.61 for FY 2019-20). Methodology: Bangladesh First Biennial Update
    Report to the UNFCCC (2023).
  year: 2022
  status: verified
  gases: CO2 only (CH4 and N2O from power plants not included)
  notes: >-
    Checked 2026-10-11 against the signed letter hosted by the Department of
    Environment (objectstorage .../office-doe/2024/12/ea2411221c1f4ff49805bb7ac39c66fa.pdf).
    0.62 tCO2/MWh = 0.62 kg/kWh. The official factor covers CO2 only (CH4 and N2O from
    generation are not included; their share is small). It is the national grid factor
    published for carbon-market use; use the same value for location-based Scope 2
    unless a buyer prescribes another dataset. Replace when DoE publishes a newer year.

diesel:
  value: 2.66155
  unit: kg_CO2e_per_litre
  source: >-
    UK Government (DESNZ) Greenhouse Gas Conversion Factors for Company Reporting 2026,
    flat file (revised), Scope 1 > Fuels > Liquid fuels > "Diesel (100% mineral diesel)",
    litres, kg CO2e (CO2 2.62818 + CH4 0.00029 + N2O 0.03308; GWP100 from IPCC AR5).
  year: 2026
  status: verified
  gases: CO2e (CO2 + CH4 + N2O, IPCC AR5 GWP100)
  notes: >-
    Checked 2026-10-17 against the official GOV.UK spreadsheet
    (ghg-conversion-factors-2026-flat-format-revised.xlsx, row ID 1_101_1012_8_1);
    unchanged from the 2025 edition.
    "100% mineral" is used because diesel sold in Bangladesh has no biodiesel blend.
    Cross-check: an IPCC 2006 default derivation (74,100 kg CO2/TJ, NCV 43.0 TJ/Gg,
    density 0.84 kg/L) gives 2.685 kg CO2e/L, within 1%.

natural_gas:
  value: 2.02633
  unit: kg_CO2e_per_m3
  source: >-
    UK Government (DESNZ) Greenhouse Gas Conversion Factors for Company Reporting 2026,
    flat file (revised), Scope 1 > Fuels > Gaseous fuels > "Natural gas", cubic metres,
    kg CO2e (CO2 2.02231 + CH4 0.00307 + N2O 0.00095; GWP100 from IPCC AR5).
  year: 2026
  status: verified
  gases: CO2e (CO2 + CH4 + N2O, IPCC AR5 GWP100)
  notes: >-
    Checked 2026-10-17 against the official GOV.UK spreadsheet
    (ghg-conversion-factors-2026-flat-format-revised.xlsx, row ID 1_100_1004_1_1).
    The 2025 edition gave 2.06672; the 2026 edition is applied to all months (about 2%
    lower). The DESNZ factor reflects UK pipeline gas. Bangladesh gas is ~97% methane with
    a reported gross calorific value around 1,030 BTU/scf (~38.4 MJ/m3), close to UK gas;
    an IPCC-default derivation for Bangladesh gas gives ~1.91-1.94 kg CO2e/m3 (4-6% lower).
    Switch to a Bangladesh-specific factor if Petrobangla/Titas publish an official
    calorific value or a buyer requires it.

lpg:
  value: 2.93936
  unit: kg_CO2e_per_kg
  source: >-
    UK Government (DESNZ) Greenhouse Gas Conversion Factors for Company Reporting 2026,
    flat file (revised), Scope 1 > Fuels > Gaseous fuels > "LPG", tonnes: 2,939.36095 kg CO2e
    per tonne (CO2 2,935.18 + CH4 2.5536 + N2O 1.62735; GWP100 from IPCC AR5), divided by
    1,000 for kg.
  year: 2026
  status: verified
  gases: CO2e (CO2 + CH4 + N2O, IPCC AR5 GWP100)
  notes: >-
    Checked 2026-10-17 against the official GOV.UK spreadsheet
    (ghg-conversion-factors-2026-flat-format-revised.xlsx, row ID 1_100_1003_15_1).
    Kilograms are used because LPG in Bangladesh is sold by cylinder weight (12, 35 or
    45 kg) or bulk weight. Cross-check: IPCC 2006 default (63,100 kg CO2/TJ x NCV
    47.3 TJ/Gg) gives 2.985 kg CO2/kg, within 2%.

furnace_oil:
  value: 3.17492
  unit: kg_CO2e_per_litre
  source: >-
    UK Government (DESNZ) Greenhouse Gas Conversion Factors for Company Reporting 2026,
    flat file (revised), Scope 1 > Fuels > Liquid fuels > "Fuel oil", litres, kg CO2e
    (CO2 3.16262 + CH4 0.0053 + N2O 0.00701; GWP100 from IPCC AR5).
  year: 2026
  status: verified
  gases: CO2e (CO2 + CH4 + N2O, IPCC AR5 GWP100)
  notes: >-
    Checked 2026-10-17 against the official GOV.UK spreadsheet (row ID 1_101_1013_8_1).
    DESNZ "Fuel oil" is residual (heavy) fuel oil, which is what Bangladesh sells as
    furnace oil (HFO) for boilers and engines. Cross-check: IPCC 2006 residual fuel oil
    default (77,400 kg CO2/TJ x NCV 40.4 TJ/Gg x ~0.98 kg/L) gives ~3.06 kg CO2/L.
