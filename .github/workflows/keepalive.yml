name: Keep API awake

# Render's free plan sleeps after 15 min without requests and takes ~1 min to wake.
# A ping every 10 min keeps it warm (one free service running all month fits in the
# 750 free instance hours). GitHub may delay scheduled runs a few minutes at busy times.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Render answers 5xx for a short time while it restarts or deploys the service, so retry
      # every error (not only timeouts) for up to ~6 minutes before calling the ping failed.
      - run: >-
          curl -fsS -o /dev/null -w "livez: HTTP %{http_code} in %{time_total}s\n"
          --max-time 45 --retry 6 --retry-delay 15 --retry-all-errors
          https://factory-carbon-api.onrender.com/livez
