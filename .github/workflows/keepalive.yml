name: Keep API awake

# Render's free plan sleeps after 15 min without requests and takes ~1 min to wake.
# A ping every 10 min keeps it warm (one free service running all month fits in the
# 750 free instance hours). GitHub may delay scheduled runs a few minutes at busy times.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://factory-carbon-api.onrender.com/livez
