name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: OpenAPI contract is up to date
        run: |
          python -m scripts.export_openapi
          git diff --exit-code ../docs/openapi.json

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      # Contract tests need a running backend; they skip themselves without BACKEND_URL.
      - run: flutter test

  contract:
    needs: [backend, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - name: Start backend
        working-directory: backend
        run: |
          APP_TOKEN=ci RATE_LIMIT_PER_MINUTE=1000 uvicorn --factory app.main:create_default_app --port 8765 &
          for i in $(seq 1 30); do curl -sf localhost:8765/livez && break; sleep 1; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: App <-> backend contract tests
        working-directory: app
        env:
          BACKEND_URL: http://127.0.0.1:8765
          APP_TOKEN: ci
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          flutter test test/contract
